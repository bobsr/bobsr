<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI Gauge Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="app">
    <section class="panel input-panel">
      <h1>BMI Calculator</h1>
      <p class="subtitle">Calculate your Body Mass Index with a gender option and gauge view.</p>

      <form id="bmiForm" class="form-grid">
        <label for="gender">Gender</label>
        <select id="gender" name="gender" required>
          <option value="female">Female</option>
          <option value="male">Male</option>
          <option value="other">Other</option>
        </select>

        <label for="height">Height (cm)</label>
        <input id="height" name="height" type="number" min="50" max="300" step="0.1" placeholder="e.g. 172" required />

        <label for="weight">Weight (kg)</label>
        <input id="weight" name="weight" type="number" min="20" max="500" step="0.1" placeholder="e.g. 68" required />

        <button type="submit">Calculate BMI</button>
      </form>
    </section>

    <section class="panel result-panel" id="resultPanel" aria-live="polite">
      <h2>Your Result</h2>
      <div class="result-values">
        <span class="pill" id="genderValue">Gender: —</span>
        <span class="bmi-number" id="bmiValue">--.-</span>
        <span class="bmi-label" id="categoryValue">No result yet</span>
      </div>

      <div class="gauge-wrap">
        <div class="gauge-track" role="img" aria-label="BMI gauge from underweight to obesity">
          <span class="zone underweight"></span>
          <span class="zone normal"></span>
          <span class="zone overweight"></span>
          <span class="zone obesity"></span>
          <div class="needle" id="needle"></div>
        </div>
        <div class="gauge-scale">
          <small>15</small>
          <small>18.5</small>
          <small>25</small>
          <small>30</small>
          <small>40+</small>
        </div>
      </div>

      <p class="result-note" id="resultNote">Enter your values to see your category and gauge position.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
