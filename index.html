<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BMI Calculator</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: linear-gradient(135deg, #eef2ff, #e0f2fe);
      color: #1e293b;
    }

    .card {
      width: min(920px, 94vw);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 16px 36px rgba(30, 41, 59, 0.16);
      overflow: hidden;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .panel {
      padding: 1.5rem;
    }

    .input-panel {
      background: #f8fafc;
      border-right: 1px solid #e2e8f0;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.6rem;
    }

    p {
      margin: 0 0 1rem;
      color: #475569;
    }

    .field {
      margin-bottom: 0.9rem;
    }

    label {
      display: block;
      font-size: 0.92rem;
      margin-bottom: 0.35rem;
      font-weight: 600;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 0.7rem;
      font-size: 1rem;
    }

    .result {
      margin-top: 1rem;
      padding: 0.9rem;
      border-radius: 10px;
      background: #fff;
      border: 1px dashed #93c5fd;
    }

    .result strong {
      font-size: 1.6rem;
      color: #0f172a;
    }

    .category {
      margin-top: 0.35rem;
      font-weight: 700;
      font-size: 1rem;
    }

    .legend {
      margin-top: 1rem;
      display: grid;
      gap: 0.45rem;
      font-size: 0.85rem;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .swatch {
      width: 14px;
      height: 14px;
      border-radius: 4px;
    }

    canvas {
      width: 100%;
      max-width: 380px;
      display: block;
      margin: 0 auto;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
      background: #fff;
    }

    @media (max-width: 820px) {
      .card {
        grid-template-columns: 1fr;
      }

      .input-panel {
        border-right: none;
        border-bottom: 1px solid #e2e8f0;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <section class="panel input-panel">
      <h1>BMI Calculator</h1>
      <p>Enter your <strong>weight in kilograms</strong> and <strong>height in feet</strong> to estimate your Body Mass Index.</p>

      <div class="field">
        <label for="weight">Weight (kg)</label>
        <input id="weight" type="number" min="1" step="0.1" value="70" />
      </div>

      <div class="field">
        <label for="height">Height (feet)</label>
        <input id="height" type="number" min="1" step="0.01" value="5.6" />
      </div>

      <section class="result" aria-live="polite">
        <div>BMI: <strong id="bmiValue">--</strong></div>
        <div class="category" id="categoryText">Enter valid values</div>
      </section>

      <div class="legend" aria-label="BMI categories">
        <div class="legend-row"><span class="swatch" style="background:#60a5fa"></span>Underweight (&lt; 18.5)</div>
        <div class="legend-row"><span class="swatch" style="background:#22c55e"></span>Normal (18.5–24.9)</div>
        <div class="legend-row"><span class="swatch" style="background:#f59e0b"></span>Overweight (25–29.9)</div>
        <div class="legend-row"><span class="swatch" style="background:#ef4444"></span>Obese (30+)</div>
      </div>
    </section>

    <section class="panel">
      <canvas id="bmiCanvas" width="380" height="300"></canvas>
    </section>
  </main>

  <script>
    const weightInput = document.getElementById('weight');
    const heightInput = document.getElementById('height');
    const bmiValue = document.getElementById('bmiValue');
    const categoryText = document.getElementById('categoryText');
    const canvas = document.getElementById('bmiCanvas');
    const ctx = canvas.getContext('2d');

    function feetToMeters(feet) {
      return feet * 0.3048;
    }

    function getCategory(bmi) {
      if (bmi < 18.5) return { label: 'Underweight', color: '#60a5fa' };
      if (bmi < 25) return { label: 'Normal', color: '#22c55e' };
      if (bmi < 30) return { label: 'Overweight', color: '#f59e0b' };
      return { label: 'Obese', color: '#ef4444' };
    }

    function drawGauge(bmi, category) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const cx = canvas.width / 2;
      const cy = 210;
      const radius = 130;
      const start = Math.PI;
      const end = 2 * Math.PI;

      const zones = [
        { end: 18.5, color: '#60a5fa' },
        { end: 25, color: '#22c55e' },
        { end: 30, color: '#f59e0b' },
        { end: 40, color: '#ef4444' }
      ];

      const maxBMI = 40;
      let lastValue = 0;

      zones.forEach(zone => {
        const a0 = start + (lastValue / maxBMI) * (end - start);
        const a1 = start + (zone.end / maxBMI) * (end - start);
        ctx.beginPath();
        ctx.arc(cx, cy, radius, a0, a1, false);
        ctx.lineWidth = 20;
        ctx.strokeStyle = zone.color;
        ctx.stroke();
        lastValue = zone.end;
      });

      const clamped = Math.max(0, Math.min(bmi, maxBMI));
      const angle = start + (clamped / maxBMI) * (end - start);
      const nx = cx + Math.cos(angle) * (radius - 6);
      const ny = cy + Math.sin(angle) * (radius - 6);

      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.lineTo(nx, ny);
      ctx.lineWidth = 4;
      ctx.strokeStyle = '#0f172a';
      ctx.stroke();

      ctx.beginPath();
      ctx.arc(cx, cy, 8, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      ctx.font = 'bold 28px Arial';
      ctx.fillStyle = '#0f172a';
      ctx.textAlign = 'center';
      ctx.fillText(Number.isFinite(bmi) ? bmi.toFixed(1) : '--', cx, 110);

      ctx.font = 'bold 20px Arial';
      ctx.fillStyle = category.color;
      ctx.fillText(category.label, cx, 140);

      ctx.font = '14px Arial';
      ctx.fillStyle = '#475569';
      ctx.fillText('BMI Gauge', cx, 270);
    }

    function recalculate() {
      const weight = Number(weightInput.value);
      const heightFeet = Number(heightInput.value);
      const heightMeters = feetToMeters(heightFeet);

      if (!weight || !heightFeet || heightMeters <= 0) {
        bmiValue.textContent = '--';
        categoryText.textContent = 'Enter valid values';
        categoryText.style.color = '#475569';
        drawGauge(0, { label: 'Awaiting Input', color: '#94a3b8' });
        return;
      }

      const bmi = weight / (heightMeters * heightMeters);
      const category = getCategory(bmi);

      bmiValue.textContent = bmi.toFixed(1);
      categoryText.textContent = category.label;
      categoryText.style.color = category.color;
      drawGauge(bmi, category);
    }

    weightInput.addEventListener('input', recalculate);
    heightInput.addEventListener('input', recalculate);

    recalculate();
  </script>
</body>
</html>
